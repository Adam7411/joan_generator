<h1 class="title" data-bind="text: title, attr:{style: title_style}"></h1>

<div class="container" data-bind="attr:{style: container_style}">
    <div id="power" data-bind="attr:{style: icon_style }">
        <i data-bind="attr: {class: icon}"></i>
    </div>
</div>

<div id="speed1" class="speed1" data-bind="attr:{style: speed1_style}">
    <i data-bind="attr: {class: icon1}"></i>
    <span>1</span>
</div>
<div id="speed2" class="speed2" data-bind="attr:{style: speed2_style}">
    <i data-bind="attr: {class: icon2}"></i>
    <span>2</span>
</div>
<div id="speed3" class="speed3" data-bind="attr:{style: speed3_style}">
    <i data-bind="attr: {class: icon3}"></i>
    <span>3</span>
</div>
