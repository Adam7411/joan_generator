<h1 class="title" data-bind="text: title, attr:{style: title_style}"></h1>

<div id="open" class="control-open">
    <i class="mdi mdi-arrow-up-bold" data-bind="attr:{style: icon_style }"></i>
</div>

<div class="icon">
    <i data-bind="attr: {class: icon, style: icon_style}"></i>
</div>

<div id="close" class="control-close">
    <i class="mdi mdi-arrow-down-bold" data-bind="attr:{style: icon_style }"></i>
</div>
